name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Deploy Backend to VPS

      uses: appleboy/ssh-action@v1.0.3

      with:

        host: ${{ secrets.VPS_HOST }}

        username: root

        key: ${{ secrets.VPS_SSH_KEY }}

        script: |

          cd /var/www/ot-controle-backend

          git fetch origin

          git reset --hard origin/master

          npm install

          pm2 restart ot-control-backend